name: E2E

# Template workflow. Both jobs drive the live public storefront, so there is no
# environment to provision. Pin the action versions to whatever your org allows
# before enabling this on a protected branch.

on:
  push:
    branches: [main]
#  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A push that supersedes an in-flight run cancels it; the live site is the
# shared resource here, so overlapping runs add load without adding signal.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  robot-e2e:
    name: Robot Framework
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: robot
    steps:
      - uses: actions/checkout@v4

      # Browser Library runs Playwright through Node even though the tests are Robot.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Install Chromium
        run: uv run rfbrowser init chromium --with-deps

      - name: Run suite
        run: uv run robot --variable RECORD_VIDEO:true --outputdir results --xunit xunit.xml tests

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: robot/results/
          retention-days: 7

  playwright-e2e:
    name: Playwright TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: playwright
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      # No dependency cache: the install takes a couple of seconds, and
      # setup-node's pnpm cache fails its post step when the Corepack-managed
      # store has not been created at the path it probes.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Type check
        run: pnpm typecheck

      - name: Run suite
        run: pnpm test
        env:
          BEE_TICK_DEMO_REPORT: "true"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: playwright/test-results/
          retention-days: 7

  publish-demo:
    name: Publish Demo
    runs-on: ubuntu-latest
    needs: [robot-e2e, playwright-e2e]
    if: always() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright tooling for the preview image
        working-directory: playwright
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Download Robot report
        uses: actions/download-artifact@v4
        with:
          name: robot-results
          path: demo/reports/robot

      - name: Download Playwright report
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: demo/reports/playwright

      - name: Download Playwright result data
        uses: actions/download-artifact@v4
        with:
          name: playwright-results
          path: playwright/test-results

      - name: Restore published run history
        continue-on-error: true
        run: curl --fail --location --silent --show-error https://mohamedraslan.github.io/beetick/runs.json --output demo/runs.json

      - name: Refresh demo metrics and preview
        run: python demo/refresh.py --skip-runs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: demo
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
